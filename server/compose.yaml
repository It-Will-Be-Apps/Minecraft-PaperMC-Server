services:
  minecraft-server:
    image: itzg/minecraft-server:latest
    pull_policy: daily
    tty: true
    stdin_open: true
    stop_grace_period: 1m
    ports:
      - "25565:25565"
    env_file:
      - .env
    volumes:
      - /opt/minecraft/data:/data
      - /opt/minecraft/server/plugins:/plugins
